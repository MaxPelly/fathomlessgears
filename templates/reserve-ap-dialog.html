<div class="col">
    <div class="flex-row">
        <p class="roll-component-description">AP</p>
        <input class="roll-component-value additional-value" type="number" data-selector="ap"
            value="{{ap}}">
    </div>
    <div class="flex-row">
        <p class="roll-component-description">{{localize "CONDITIONS.quickened"}}</p>
        <input type="checkbox" name="quickened" data-selector="quickened" class="inline-checkbox" {{checked quickened}}>
    </div>
    <div class="btn" data-action="confirm">{{localize "RESERVEDIALOG.confirm"}}</div>
</div>
